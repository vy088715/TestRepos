version: "3.9"

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gitp-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "GITPsecret!2024"
      MSSQL_PID: "Express"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'GITPsecret!2024' -Q 'SELECT 1' -No -C || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - gitp-network

  db-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./database:/scripts
    command: >
      bash -c "
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U SA -P 'GITPsecret!2024' -No -C -d master -Q 'IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = N''gitpdb'') CREATE DATABASE gitpdb;' &&
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U SA -P 'GITPsecret!2024' -No -C -d gitpdb -i /scripts/init.sql &&
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U SA -P 'GITPsecret!2024' -No -C -d gitpdb -i /scripts/seed.sql
      "
    networks:
      - gitp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gitp-backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=mssql;Database=gitpdb;User Id=SA;Password=GITPsecret!2024;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Key: "GITP_DEFAULT_SECRET_KEY_CHANGE_IN_PRODUCTION_32CHARS_MINIMUM"
      FrontendBaseUrl: "http://localhost:3000"
      Storage__LocalPath: /app/uploads
      Storage__ExportsPath: /app/exports
    volumes:
      - uploads_data:/app/uploads
      - exports_data:/app/exports
    ports:
      - "8080:80"
    networks:
      - gitp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gitp-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - gitp-network

networks:
  gitp-network:
    driver: bridge

volumes:
  mssql_data:
  uploads_data:
  exports_data:
